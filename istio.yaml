apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: microservices-template-gateway
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: microservices-template-service
spec:
  hosts:
    - "*"
  gateways:
    - istio-system/microservices-template-gateway
  http:
    - match:
        - uri:
            prefix: /api/accounts/
      timeout: 5s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,refused-stream,5xx,reset
      route:
        - destination:
            host: accounts-service
            port:
              number: 8080

    - match:
        - uri:
            prefix: /api/cards/
      timeout: 5s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,refused-stream,5xx,reset
      route:
        - destination:
            host: cards-service
            port:
              number: 8090

    - match:
        - uri:
            prefix: /api/loans/
      timeout: 5s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,refused-stream,5xx,reset
      route:
        - destination:
            host: loans-service
            port:
              number: 8070
---
apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: req-authn-for-all
  namespace: istio-system
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  jwtRules:
    - issuer: "https://sts.windows.net/2e9d1507-a56f-45ea-a9f6-b107e61a2b4e/"
      jwksUri: "https://login.microsoftonline.com/2e9d1507-a56f-45ea-a9f6-b107e61a2b4e/discovery/v2.0/keys"
      audiences:
        - "api://7ee2de60-5dff-4bf8-b71d-8b01a390f4d3"
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: require-jwt-for-all
  namespace: istio-system
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  action: ALLOW
  rules:
    - to:
        - operation:
            paths: ["/api/accounts/*"]
      when:
        - key: request.auth.claims[roles]
          values: ["ACCOUNTS"]
    - to:
        - operation:
            paths: ["/api/cards/*"]
      when:
        - key: request.auth.claims[roles]
          values: ["CARDS"]
    - to:
        - operation:
            paths: ["/api/loans/*"]
      when:
        - key: request.auth.claims[roles]
          values: ["LOANS"]
---
# 1) Enforce STRICT mTLS for all services in the default namespace
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: default
spec:
  mtls:
    mode: STRICT

---
# 2) Make ALL traffic TO services in default namespace use mTLS
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: default
  namespace: default
spec:
  host: "*.default.svc.cluster.local"
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL

    # Circuit breaking (limits how much we allow per upstream)
    connectionPool:
      tcp:
        maxConnections: 50
      http:
        http1MaxPendingRequests: 100
        maxRequestsPerConnection: 100

    # Outlier detection (eject unhealthy pods)
    outlierDetection:
      interval: 5s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
